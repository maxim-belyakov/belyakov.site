name: CI

on:
  push:
    branches: [master, next-app]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run check:dashes
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
